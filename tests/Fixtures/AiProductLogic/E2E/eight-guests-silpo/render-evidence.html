<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Eight guests Silpo evidence renderer</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #dce8e5; color: #18322d; font-family: "DejaVu Sans", Arial, sans-serif; }
        .header { height: 92px; padding: 22px 32px; background: #167b68; color: #fff; box-shadow: 0 2px 8px #0003; }
        .header h1 { margin: 0 0 5px; font-size: 24px; }
        .header p { margin: 0; opacity: .82; font-size: 13px; }
        .chat { min-height: 730px; padding: 38px 34px 24px; background: linear-gradient(135deg, #e9f2ef 25%, #dfece8 25%, #dfece8 50%, #e9f2ef 50%, #e9f2ef 75%, #dfece8 75%); background-size: 36px 36px; }
        .day { width: max-content; margin: -22px auto 24px; padding: 7px 15px; border-radius: 15px; background: #fffbe9; color: #64746f; box-shadow: 0 1px 4px #0002; font-size: 13px; }
        .msg { position: relative; max-width: 82%; margin: 0 0 18px; padding: 15px 17px 12px; border-radius: 18px; box-shadow: 0 2px 7px #0002; font-size: 18px; line-height: 1.38; }
        .msg b { display: inline-block; margin-right: 10px; color: #167b68; font-size: 15px; }
        .msg .time { color: #71827d; font-size: 12px; }
        .msg p { margin: 9px 0 0; }
        .incoming { border-bottom-left-radius: 5px; background: #fff; }
        .outgoing { margin-left: auto; border-bottom-right-radius: 5px; background: #d5f8d5; }
        .work { border-left: 5px solid #5264d8; }
        .quote { margin-top: 8px; padding: 8px 10px; border-left: 4px solid #e88b32; border-radius: 5px; background: #f4f6f5; }
        .quote b, .quote span { display: block; }
        .quote span { margin-top: 3px; color: #52615d; font-size: 14px; }
        .poll { margin-top: 12px; padding: 15px; border: 1px solid #b8d8d0; border-radius: 12px; background: #f6fbf9; }
        .poll h3 { margin: 0 0 9px; }
        .bar { height: 8px; overflow: hidden; border-radius: 8px; background: #d7e1de; }
        .bar i { display: block; width: 100%; height: 100%; background: #1ea686; }
        .poll strong { display: block; margin: 8px 0; }
        .poll ul { margin: 8px 0; padding: 0; columns: 2; list-style: none; }
        .poll li { padding: 3px; color: #244c43; }
        .poll small { color: #657a74; }
        .footer { height: 78px; padding: 20px 32px; border-top: 1px solid #c5d5d0; background: #f8faf9; color: #4c625c; font-weight: 600; }
        .forward { display: inline-block; margin-bottom: 12px; padding: 8px 13px; border-radius: 8px; background: #6459a6; color: #fff; font-size: 12px; font-weight: 700; letter-spacing: .5px; }
        .crop { padding: 13px 13px 0; border: 3px dashed #8b82c2; border-radius: 12px; background: #ffffff66; }
        .crop .msg { max-width: 94%; font-size: 16px; }
        .product { display: flex; min-height: 600px; align-items: center; gap: 36px; padding: 38px; border-radius: 26px; background: #fff; box-shadow: 0 8px 28px #0002; }
        .bottle { display: flex; width: 220px; height: 390px; flex-direction: column; align-items: center; justify-content: center; border: 8px solid #20140d; border-radius: 58px 58px 28px 28px; background: linear-gradient(#28180d 0 18%, #cf2b23 18% 78%, #311b0e 78%); color: #fff; font-size: 44px; font-weight: 900; text-shadow: 0 2px 0 #000; }
        .bottle small { color: #ffd75e; font-size: 22px; }
        .product-info { flex: 1; }
        .product-info h1 { margin: 14px 0; font-size: 31px; line-height: 1.1; }
        .badge { padding: 6px 10px; border-radius: 6px; background: #e9a82a; color: #fff; font-weight: 700; }
        .brand { color: #64706d; }
        .price { margin: 22px 0; color: #167b68; font-size: 32px; font-weight: 800; }
        .allergen { padding: 16px; border: 2px solid #e5b83f; border-radius: 10px; background: #fff8dc; font-size: 18px; line-height: 1.45; }
        .danger { margin-top: 18px; padding: 12px; border-radius: 8px; background: #c92828; color: #fff; font-weight: 900; letter-spacing: .8px; text-align: center; }
        .emoji-smile { position: relative; display: inline-block; width: 19px; height: 19px; margin: 0 2px; border: 1px solid #ca9b22; border-radius: 50%; background: #f6c945; vertical-align: -3px; }
        .emoji-smile::before { content: '••'; position: absolute; top: -5px; left: 4px; color: #654a10; font-size: 12px; letter-spacing: 3px; }
        .emoji-smile::after { content: '⌣'; position: absolute; top: 3px; left: 4px; color: #654a10; font-size: 13px; font-weight: 700; }
    </style>
</head>
<body>
<div class="header"><h1 id="title"></h1><p>Фіктивний QA-матеріал · без персональних даних</p></div>
<main class="chat"><div class="day" id="date"></div><div id="content"></div></main>
<div class="footer" id="note"></div>
<script>
    const fixtures = {
        S01: {
            title: 'Мангал на Дніпрі', date: '23 серпня', note: 'Опитування • список відповідей обрізано',
            body: '<div class="msg incoming"><b>Роман</b><span class="time">09:02</span><p>Хто точно буде в неділю?</p><div class="poll"><h3>Буду на мангалі</h3><div class="bar"><i></i></div><strong>8 голосів</strong><ul><li>✓ Роман</li><li>✓ Іра</li><li>✓ Оля</li><li>✓ Маша</li><li>✓ Катя</li></ul><small>Показано 5 з 8 відповідей</small></div></div>',
        },
        S02: {
            title: 'Мангал на Дніпрі', date: '22 серпня', note: 'Старе повідомлення • 22 серпня',
            body: '<div class="msg incoming"><b>Леся</b><span class="time">20:14</span><p>Я не прийду. Завал на роботі, дедлайн до понеділка.</p></div><div class="msg outgoing"><b>Роман</b><span class="time">20:16</span><p>Шкода. Якщо щось зміниться — напиши.</p></div>',
        },
        S03: {
            title: 'Мангал на Дніпрі', date: '25 серпня', note: 'Відповідь із цитатою • актуальне повідомлення 25 серпня',
            body: '<div class="msg incoming"><b>Леся</b><span class="time">18:27</span><div class="quote"><b>Леся · 22 серпня, 20:14</b><span>Я не прийду. Завал на роботі…</span></div><p>Та вже розгребла <span class="emoji-smile" aria-label="🙂"></span> Я точно буду</p></div><div class="msg outgoing"><b>Роман</b><span class="time">18:28</span><p>Супер, записав!</p></div>',
        },
        S04: {
            title: 'Мангал на Дніпрі', date: '23 серпня', note: 'Непряме твердження • потребує уточнення від Маші',
            body: '<div class="msg incoming"><b>Катя</b><span class="time">09:11</span><p>Здається, у Маші алергія чи то на горіхи, чи саме на арахіс. Я не впевнена.</p></div><div class="msg outgoing"><b>Роман</b><span class="time">09:12</span><p>Не будемо вгадувати — я запитаю її напряму.</p></div>',
        },
        S05: {
            title: 'Переслано Роману', date: '25 серпня', note: 'Інший кадр того самого обговорення • не новий факт',
            body: '<div class="forward">ПЕРЕСЛАНЕ ПОВІДОМЛЕННЯ · ФРАГМЕНТ</div><div class="crop"><div class="msg incoming"><b>Катя</b><span class="time">23 серпня, 09:11</span><p>…у Маші алергія чи то на горіхи, чи саме на арахіс. Я не впевнена.</p></div><div class="msg outgoing"><b>Роман</b><span class="time">09:12</span><p>…я запитаю її напряму.</p></div></div><div class="msg incoming"><b>Іра</b><span class="time">18:33</span><p>Це той самий шматок чату, просто пересилаю крупніше.</p></div>',
        },
        S06: {
            title: 'Мангал на Дніпрі', date: '23 серпня', note: 'Попередня домовленість • ще не підтверджено',
            body: '<div class="msg incoming"><b>Оля</b><span class="time">09:14</span><p>Може, я візьму хумус і лимонад. Але поки не викреслюйте їх із закупів — скажу точно ближче до неділі.</p></div><div class="msg outgoing"><b>Роман</b><span class="time">09:15</span><p>Ок, поки це не фінальна обіцянка.</p></div>',
        },
        S07: {
            title: 'Мангал на Дніпрі', date: '25 серпня', note: 'Фінальне пряме підтвердження Олі',
            body: '<div class="msg incoming"><b>Оля</b><span class="time">18:30</span><p>Фінально: хумус 800 г беру сама — запечатаний, без арахісу і без напису «може містити арахіс».</p><p>Лимонад не беру, не встигаю.</p></div><div class="msg outgoing"><b>Роман</b><span class="time">18:31</span><p>Прийнято: хумус твій, лимонад купуємо.</p></div>',
        },
        S08: {
            title: 'Мангал на Дніпрі', date: '23 серпня', note: 'Стара обіцянка Тараса • пізніше змінена',
            body: '<div class="msg incoming"><b>Тарас</b><span class="time">09:13</span><p>Я беру вугілля — дві пачки по 2,5 кг — і розпал. Мангал та шампури теж у мене.</p></div><div class="msg outgoing"><b>Роман</b><span class="time">09:14</span><p>Домовились, дякую.</p></div>',
        },
        S09: {
            title: 'Мангал на Дніпрі', date: '25 серпня', note: 'Скасування Тараса • попередня згода Богдана',
            body: '<div class="msg incoming"><b>Тарас</b><span class="time">18:20</span><div class="quote"><b>Тарас · 23 серпня</b><span>Я беру вугілля… і розпал.</span></div><p>Апдейт: вугілля й розпал не зможу забрати. Мангал та 8 шампурів привезу.</p></div><div class="msg incoming"><b>Богдан</b><span class="time">18:22</span><p>Я, мабуть, зможу підхопити вугілля й розпал. Підтверджу окремо.</p></div>',
        },
        S10: {
            title: 'Мангал на Дніпрі', date: '23 серпня', note: 'Попередня обіцянка Каті',
            body: '<div class="msg incoming"><b>Катя</b><span class="time">09:15</span><p>Лід, може, візьму я, якщо встигну заїхати. Поки не розраховуйте на нього як на підтверджений.</p></div><div class="msg outgoing"><b>Роман</b><span class="time">09:16</span><p>Ок, лишаю в списку до підтвердження.</p></div>',
        },
        S11: {
            title: 'Команда · реліз 4.12', date: '25 серпня', note: 'Робочий чат • не стосується події чи продуктів',
            body: '<div class="msg incoming work"><b>Денис</b><span class="time">16:04</span><p>PR #418 уже пройшов CI. Хто може зробити фінальний review?</p></div><div class="msg outgoing work"><b>Аліна</b><span class="time">16:07</span><p>Я гляну міграцію та regression suite після стендапу.</p></div><div class="msg incoming work"><b>Денис</b><span class="time">16:09</span><p>Дякую. Релізний тег не ставимо до approve.</p></div>',
        },
        S12: {
            title: 'Картка товару', date: '25 серпня', note: 'Зображення товару • алергенний продукт, не для кошика',
            body: '<div class="product"><div class="bottle">SATAY<small>SAUCE</small></div><div class="product-info"><span class="badge">Соус</span><h1>Соус сатай з арахісом</h1><p class="brand">Thai Market · 250 мл</p><div class="price">129,90 ₴</div><div class="allergen"><strong>СКЛАД:</strong> арахіс 35%, кокосове молоко, соєвий соус, цукор, спеції.</div><div class="danger">МІСТИТЬ АРАХІС</div></div></div>',
        },
    };

    const key = new URLSearchParams(window.location.search).get('shot') || 'S01';
    const fixture = fixtures[key];

    document.querySelector('#title').textContent = fixture.title;
    document.querySelector('#date').textContent = fixture.date;
    document.querySelector('#content').innerHTML = fixture.body;
    document.querySelector('#note').textContent = fixture.note;
</script>
</body>
</html>
